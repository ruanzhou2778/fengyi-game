services:
  game:
    build: .
    container_name: fengyi-game
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      FLASK_DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-Qwen/Qwen2.5-72B-Instruct}
    volumes:
      - ./saves:/app/saves
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
